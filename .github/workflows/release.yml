name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Requires a trusted publisher on npmjs.com pointing at this workflow file.
    # npm then mints a short lived credential per run, so there is no token to
    # leak, and it attaches a provenance attestation without being asked
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Check the tag against the version being published
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node --print 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match package version $version." >&2
            exit 1
          fi

      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test --run
      - run: pnpm run build

      # npm rather than pnpm, since pnpm's OIDC support is still landing
      # (pnpm/pnpm#11513). Trusted publishing needs npm 11.5.1 or later
      - run: npm install --global npm@latest
      - run: npm publish
