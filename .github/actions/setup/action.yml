name: Set up
description: Installs pnpm, Node and the dependency tree.

inputs:
  node-version:
    description: Node version to install. Defaults to the one in .nvmrc.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        # setup-node prefers node-version, so an empty input falls through to
        # the file
        node-version: ${{ inputs.node-version }}
        node-version-file: .nvmrc
        cache: pnpm
    # Nothing here needs a lifecycle script, so skipping them takes install
    # time code execution away from every dependency
    - shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
