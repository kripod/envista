name: Set up
description: Installs pnpm, Node and the dependency tree.

inputs:
  node-version:
    description: Node version to install. Defaults to the one in .nvmrc.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        # setup-node prefers node-version, so an empty input falls through to
        # the file
        node-version: ${{ inputs.node-version }}
        node-version-file: .nvmrc
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
